name: Live Swingtrade AI Scanner

on:
  # Hiermee kun je het handmatig starten via de knop 'Run workflow'
  workflow_dispatch:
  
  # Draait automatisch elke dag op werkdagen om 15:30 UTC (rond beursopening VS)
  schedule:
    - cron: '30 15 * * 1-5'

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Code ophalen uit repository
      uses: actions/checkout@v3

    - name: Python instellen
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: NLTK / TextBlob data klaarmaken
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m textblob.download_corpora lite

    - name: Run Swing Scanner
      run: python main.py
